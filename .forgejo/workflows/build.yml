name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: codeberg-medium-lazy

    steps:
    - name: Check out code
      uses: https://code.forgejo.org/actions/checkout@v4
      with:
        submodules: true

    # 更改 2: 添加缓存步骤，这是加速的关键！
    - name: Cache Cargo dependencies
      uses: https://code.forgejo.org/actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Rust
      uses: https://github.com/dtolnay/rust-toolchain@stable
      
    - name: Update package lists
      run: sudo apt-get update

    - name: Install Core Build Tools
      run: sudo apt-get install -y autoconf automake libtool pkg-config nasm libclang-dev

    - name: Install libass Dependencies
      run: sudo apt-get install -y libfreetype6-dev libfribidi-dev libharfbuzz-dev libfontconfig1-dev

    - name: Install GStreamer Dependencies
      run: sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav libgstrtspserver-1.0-dev libges-1.0-dev

    - name: Generate libass configure script
      run: cd aweft-libass/third_party/libass && autoreconf -ivf

    - name: Build
      run: cargo build -j 1 --verbose
      
    - name: Test
      run: cargo test -j 2 --verbose
